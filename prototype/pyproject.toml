[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-kilo"
version = "0.1.0"
description = "Import a Kilo session into Pi and continue it locally"
readme = "KiloImport.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
pi-kilo = "kilo_import:main"

[tool.setuptools]
py-modules = ["kilo_import", "pi_to_kilo"]
